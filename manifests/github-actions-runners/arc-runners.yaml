apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: arc-runners
  namespace: arc-runners
spec:
  interval: 10m
  url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
  ref:
    tag: "0.15.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eks-runners
  namespace: arc-runners
spec:
  interval: 10m
  releaseName: eks-runners
  targetNamespace: arc-runners
  storageNamespace: arc-runners

  chartRef:
    kind: OCIRepository
    name: arc-runners
  values:
    githubConfigUrl: "https://github.com/mohamedelkony/kony-eks"
    githubConfigSecret: github-auth
    minRunners: 0
    maxRunners: 3
